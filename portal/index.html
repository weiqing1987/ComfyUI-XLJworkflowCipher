<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XLJworkflowCipher Key Portal</title>
    <link rel="stylesheet" href="/xljworkflowcipher/portal/styles.css" />
  </head>
  <body data-page="main">
    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">XLJworkflowCipher</p>
          <h1>Workflow Key Portal</h1>
          <p class="summary">不获取工作流，核心加密，守护你的核心技术。</p>
        </div>
        <div class="status" id="status">正在初始化...</div>
      </section>

      <section class="panel auth-panel" id="authPanel">
        <div class="panel-head">
          <h2>注册 / 登录</h2>
          <p>先登录后台账号，再管理工作流和密钥。</p>
        </div>
        <form id="authForm" class="form-grid">
          <label>
            <span>用户名</span>
            <input id="username" name="username" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="button-row">
            <button type="submit">登录</button>
            <button type="button" class="ghost" id="registerButton">注册并登录</button>
          </div>
        </form>
      </section>

      <section class="panel dashboard hidden" id="dashboard">
        <div class="panel-head split">
          <div>
            <h2>用户数据</h2>
            <p id="welcomeText"></p>
          </div>
          <div class="button-row">
            <a class="ghost-link" href="/xljworkflowcipher/portal/recycle" target="_self">回收站</a>
            <a class="ghost-link" href="/xljworkflowcipher/portal/expiring" target="_self">即将到期密钥</a>
            <button type="button" class="ghost" id="passwordToggleButton">修改密码</button>
            <button type="button" class="ghost" id="logoutButton">退出登录</button>
          </div>
        </div>

        <div class="stats-grid stats-grid-two">
          <article class="stat-card">
            <span class="stat-label">加密工作流</span>
            <strong class="stat-value" id="workflowCount">0</strong>
            <span class="hint">当前账号下的有效工作流数量</span>
          </article>
          <article class="stat-card stat-card-link">
            <a href="/xljworkflowcipher/portal/expiring" target="_self">
              <span class="stat-label">1 天内到期密钥</span>
              <strong class="stat-value" id="expiringCount">0</strong>
              <span class="hint">点击查看 24 小时内到期的密钥</span>
            </a>
          </article>
        </div>

        <section class="password-panel hidden" id="passwordPanel">
          <div class="panel-head split">
            <div>
              <h3>修改密码</h3>
              <p>请输入原密码和新密码。新密码至少 6 位。</p>
            </div>
            <button type="button" class="ghost" id="passwordCloseButton">收起</button>
          </div>
          <form id="passwordForm" class="password-form">
            <label>
              <span>原密码</span>
              <div class="password-input">
                <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required />
                <button type="button" class="ghost toggle-visibility" data-target="currentPassword">显示</button>
              </div>
            </label>
            <label>
              <span>新密码</span>
              <div class="password-input">
                <input id="newPassword" name="new_password" type="password" autocomplete="new-password" required />
                <button type="button" class="ghost toggle-visibility" data-target="newPassword">显示</button>
              </div>
            </label>
            <label>
              <span>确认新密码</span>
              <div class="password-input">
                <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" required />
                <button type="button" class="ghost toggle-visibility" data-target="confirmPassword">显示</button>
              </div>
            </label>
            <button type="submit">保存新密码</button>
          </form>
        </section>

        <div class="list-head">
          <h3>加密工作流列表</h3>
          <button type="button" class="ghost" id="refreshButton">刷新</button>
        </div>
        <div id="groupsList" class="groups-list"></div>
        <div id="groupsPagination" class="pagination"></div>
      </section>
    </main>

    <template id="groupTemplate">
      <article class="group-card">
        <header class="group-header">
          <div>
            <h3 class="group-name"></h3>
            <p class="group-code"></p>
          </div>
          <span class="pill group-status"></span>
        </header>

        <div class="group-actions active-actions">
          <label>
            <span>有效期</span>
            <select class="expiry-select">
              <option value="day">按天</option>
              <option value="week">按周</option>
              <option value="month">按月</option>
              <option value="unlimited">不限时</option>
            </select>
          </label>
          <button type="button" class="generate-key">生成密钥</button>
          <button type="button" class="ghost disable-group">停用</button>
          <button type="button" class="danger destroy-group">销毁</button>
        </div>

        <div class="group-actions recycle-actions hidden">
          <div class="hint recycle-deadline"></div>
          <button type="button" class="ghost restore-group">恢复</button>
          <button type="button" class="danger delete-group">彻底删除</button>
        </div>

        <div class="keys-wrap">
          <div class="keys-head">
            <div>
              <span>密钥列表</span>
              <span class="hint key-summary"></span>
            </div>
            <button type="button" class="ghost toggle-keys">展开</button>
          </div>
          <div class="keys-table hidden"></div>
        </div>
      </article>
    </template>

    <script type="module" src="/xljworkflowcipher/portal/app.js"></script>
  </body>
</html>
